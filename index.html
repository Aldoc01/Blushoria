<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"/>

  <title>Blushoria Store ✨</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <!-- HERO -->

  <section class="hero">

    <img
    src="logo.png"
    alt="Blushoria Logo"
    class="logo">

    <h1>BLUSHORIA ✨</h1>

    <p>
      Luxury Girlie Essentials • Cute • Soft • Feminine
    </p>

    <a href="#products" class="hero-btn">
      Shop Now 💖
    </a>

  </section>

  <!-- PRODUCTS -->

  <h2 class="section-title">
    Our Products 💕
  </h2>

  <section
  class="products"
  id="products"></section>

  <!-- CART -->

  <section class="cart-section">

    <div class="cart-box">

      <h2>Your Cart 🛒</h2>

      <div
      id="cart-items"
      class="cart-items"></div>

      <h3 class="cart-total">
        Total:
        <span id="cart-total">₦0</span>
      </h3>

      <input
      type="text"
      id="customer-name"
      placeholder="Your Name">

      <input
      type="text"
      id="customer-address"
      placeholder="Delivery Address">

      <p class="delivery-note">
        🚚 Waybill delivery fee depends on your location and will be discussed on WhatsApp.
      </p>

      <button onclick="orderOnWhatsApp()">
        Order On WhatsApp ✨
      </button>

    </div>

  </section>

  <!-- FOOTER -->

  <footer>
    © 2025 BLUSHORIA STORE ✨
  </footer>

  <script src="app.js"></script>

</body>
</html>
