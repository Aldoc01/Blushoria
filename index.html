<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Blushoria Store ✨</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>

<body>

  <!-- HERO -->

  <section class="hero">

    <img
      src="logo.png"
      alt="Blushoria Logo"
      class="logo"
    >

    <h1>
      Blushoria Store ✨
    </h1>

    <p>
      Luxury feminine beauty essentials with a soft pink aesthetic 💖
    </p>

  </section>

  <!-- PRODUCTS -->

  <section
    class="products"
    id="products"
  ></section>

  <!-- CART -->

  <section class="cart-section">

    <h2>
      Your Cart 🛒
    </h2>

    <h3>
      Total:
      <span id="cart-total">
        ₦0
      </span>
    </h3>

    <input
      type="text"
      id="customer-name"
      placeholder="Your Name"
    >

    <input
      type="text"
      id="customer-address"
      placeholder="Delivery Address"
    >

    <p class="delivery-note">
      🚚 Waybill fee depends on your location and will be discussed on WhatsApp.
    </p>

    <button onclick="orderOnWhatsApp()">
      Order On WhatsApp 💖
    </button>

  </section>

  <!-- FOOTER -->

  <footer>
    © 2025 BLUSHORIA STORE ✨
  </footer>

  <script src="app.js"></script>

</body>
</html>
