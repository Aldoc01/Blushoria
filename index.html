<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Blushoria</title>

  <link rel="stylesheet" href="styles.css"/>
</head>

<body>

  <div class="overlay"></div>

  <header class="hero">

    <img src="logo.png" class="logo"/>

    <h1>
      Luxury Girlie Essentials ✨
    </h1>

    <p>
      Cute • Soft • Feminine • Aesthetic
    </p>

  </header>

  <section id="products"></section>

  <section class="cart">

    <h2>Your Cart 🛒</h2>

    <div id="cart-items"></div>

    <h3>
      Total:
      <span id="cart-total">₦0</span>
    </h3>

    <input
      type="text"
      id="customer-name"
      placeholder="Your Name"
    />

    <input
      type="text"
      id="customer-address"
      placeholder="Your Address"
    />

    <button onclick="orderWhatsApp()">
      Order On WhatsApp
    </button>

  </section>

  <footer>
    © 2025 BLUSHORIA ✨
  </footer>

  <script src="app.js"></script>

</body>
</html>
