<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blushoria Store</title>

<link rel="stylesheet" href="styles.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body>

<header>

<h1>✨ BLUSHORIA</h1>

<p>Luxury Beauty Store</p>

<input
type="text"
id="searchInput"
placeholder="Search products..."
onkeyup="searchProducts()">

</header>

<section class="categories">

<button onclick="filterCategory('All')">All</button>

<button onclick="filterCategory('Lip Gloss')">
Lip Gloss
</button>

<button onclick="filterCategory('Mask')">
Face Masks
</button>

<button onclick="filterCategory('Beauty')">
Beauty
</button>

</section>

<section class="products" id="products">

</section>

<section class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<h3 id="cartTotal">
Total: ₦0
</h3>

<input
type="text"
id="customerName"
placeholder="Your Name">

<input
type="text"
id="customerPhone"
placeholder="Phone Number">

<button onclick="checkoutWhatsApp()">
Order via WhatsApp
</button>

</section>

<section class="reviews">

<h2>Customer Reviews ✨</h2>

<div class="review-card">
★★★★★ Amazing products!
</div>

<div class="review-card">
★★★★★ Fast delivery in Lagos!
</div>

<div class="review-card">
★★★★★ Luxury packaging 😍
</div>

</section>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
