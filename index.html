<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blushoria Store</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    background:black;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:#222;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.info{
    padding:10px;
}

.price{
    color:pink;
    font-size:20px;
    font-weight:bold;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:pink;
    color:black;
    font-weight:bold;
    border-radius:10px;
    margin-top:10px;
}

</style>
</head>

<body>

<header>Blushoria Store</header>

<div class="products" id="products"></div>

<script>

function loadProducts(){

    const products = JSON.parse(localStorage.getItem("products")) || [];

    const container = document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product=>{

        container.innerHTML += `

        <div class="card">

            <img src="${product.image}">

            <div class="info">

                <h3>${product.name}</h3>

                <p>${product.description}</p>

                <div class="price">
                UGX ${product.price}
                </div>

                <button>Buy Now</button>

            </div>

        </div>

        `;

    });

}

loadProducts();

</script>

</body>
</html>
