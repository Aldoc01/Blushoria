<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Blushoria</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="overlay"></div>

  <header class="hero">

    <img src="./logo.png" class="logo" />

    <h1>
      Luxury Girlie<br>
      Essentials ✨
    </h1>

    <p>
      Cute • Soft • Feminine • Aesthetic
    </p>

  </header>

  <main id="products"></main>

  <section class="cart-section">

    <h2>🛒 Your Cart</h2>

    <h3>
      Total:
      <span id="cart-total">₦0</span>
    </h3>

    <input
      type="text"
      id="customerName"
      placeholder="Your Name"
    />

    <input
      type="tel"
      id="customerPhone"
      placeholder="Your Phone Number"
    />

    <button onclick="orderWhatsApp()">
      Order On WhatsApp
    </button>

  </section>

  <section class="reviews">

    <h2>Customer Reviews ✨</h2>

    <div class="review">
      ⭐⭐⭐⭐⭐
      <p>Everything is sooo cute 😍</p>
      <span>— Amanda</span>
    </div>

    <div class="review">
      ⭐⭐⭐⭐⭐
      <p>Fast delivery and amazing products 💖</p>
      <span>— Sophia</span>
    </div>

  </section>

  <footer>
    © 2025 BLUSHORIA ✨
  </footer>

  <script src="app.js"></script>

</body>
</html>
