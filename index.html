<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Blushoria ✨</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero">

    <img src="logo.png" alt="Blushoria Logo" class="logo">

    <h1>
      Luxury Girlie Essentials ✨
    </h1>

    <p>
      Cute • Soft • Feminine • Aesthetic
    </p>

  </section>

  <!-- PRODUCTS -->
  <section class="products" id="products"></section>

  <!-- CART -->
  <section class="cart">

    <h2>Your Cart 🛒</h2>

    <p id="total">Total: ₦0</p>

    <input
      type="text"
      id="customerName"
      placeholder="Your Name"
    >

    <input
      type="text"
      id="customerAddress"
      placeholder="Your Address"
    >

    <button
      class="whatsapp-btn"
      onclick="orderWhatsApp()"
    >
      Order On WhatsApp
    </button>

  </section>

  <!-- FOOTER -->
  <footer>
    © 2025 BLUSHORIA ✨
  </footer>

  <!-- SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
