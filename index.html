<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Blushoria Store</title>

<link rel="stylesheet" href="styles.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body>

<header>

<h1>✨ BLUSHORIA</h1>

<p>Luxury Beauty Store</p>

<input
type="text"
id="searchInput"
placeholder="Search products..."
onkeyup="searchProducts()">

</header>

<section class="categories">

<button onclick="filterCategory('All')">
All
</button>

<button onclick="filterCategory('Lip Gloss')">
Lip Gloss
</button>

<button onclick="filterCategory('Mask')">
Masks
</button>

<button onclick="filterCategory('Beauty')">
Beauty
</button>

</section>

<section
class="products"
id="products">

</section>

<section class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<h3 id="cartTotal">
Total: ₦0
</h3>

<input
type="text"
id="customerName"
placeholder="Your Name">

<input
type="text"
id="customerPhone"
placeholder="Phone Number">

<input
type="text"
id="customerAddress"
placeholder="Delivery Address">

<select id="deliveryLocation">

<option value="Lagos">
Lagos
</option>

<option value="Abuja">
Abuja
</option>

<option value="Port Harcourt">
Port Harcourt
</option>

<option value="Ibadan">
Ibadan
</option>

<option value="Benin">
Benin
</option>

<option value="Other">
Other Location
</option>

</select>

<button onclick="checkoutWhatsApp()">

Order Via WhatsApp

</button>

</section>

<section class="reviews">

<h2>
Customer Reviews ✨
</h2>

<div class="review-card">
★★★★★ Amazing quality products!
</div>

<div class="review-card">
★★★★★ Fast delivery in Nigeria 🇳🇬
</div>

<div class="review-card">
★★★★★ Luxury packaging 😍
</div>

</section>

<a
href="https://wa.me/2347012620748"
class="floating-whatsapp"
target="_blank">

💬

</a>

<script src="firebase.js"></script>

<script src="app.js"></script>

</body>
</html>
