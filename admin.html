<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Blushoria Admin</title>

<link rel="stylesheet"
href="styles.css">

<script type="module"
src="admin.js"
defer></script>

</head>

<body>

<div class="admin-container">

<h1>Admin Dashboard</h1>

<div class="admin-card">

<input
type="text"
id="name"
placeholder="Product Name">

<textarea
id="description"
placeholder="Description"></textarea>

<input
type="number"
id="price"
placeholder="Price">

<input
type="file"
id="imageFile"
accept="image/*">

<button id="uploadBtn">
Upload Product
</button>

</div>

<div id="status"></div>

</div>

</body>
</html>
