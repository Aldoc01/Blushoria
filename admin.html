<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Blushoria Admin</title>

  <link rel="stylesheet" href="style.css"/>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js" defer></script>
</head>
<body>

  <div class="admin-container">

    <h1>Admin Dashboard</h1>

    <div class="admin-card">

      <input type="text" id="product-name" placeholder="Product Name"/>
      <textarea id="product-description" placeholder="Description"></textarea>

      <input type="number" id="product-price" placeholder="Price"/>

      <input type="file" id="product-image"/>

      <button id="add-product-btn">
        Upload Product
      </button>

    </div>

    <div class="products-section">
      <h2>Existing Products</h2>

      <div id="admin-products" class="products-grid"></div>
    </div>

  </div>

</body>
</html>
