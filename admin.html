<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blushoria Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{--rose:#c9737a;--gold:#c9a460;--cream:#fdf6f0;--dark:#1a1212;--text:#5a4a4a;--gray:#7a6e6e;}
    body{background:#f5f5f5;color:var(--dark);font-family:'Jost',sans-serif;font-weight:300;}
    
    .admin-container{display:grid;grid-template-columns:250px 1fr;min-height:100vh;gap:0;}
    
    /* SIDEBAR */
    .admin-sidebar{background:var(--dark);color:white;padding:2rem;position:fixed;left:0;top:0;bottom:0;width:250px;overflow-y:auto;}
    .admin-logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;margin-bottom:2rem;color:var(--rose);}
    .admin-nav{display:flex;flex-direction:column;gap:0.5rem;}
    .admin-nav a{display:block;padding:1rem;border-radius:6px;color:rgba(255,255,255,0.8);text-decoration:none;transition:all 0.3s;cursor:pointer;}
    .admin-nav a:hover,.admin-nav a.active{background:var(--rose);color:white;}
    .admin-logout{margin-top:auto;padding:1rem;background:rgba(255,255,255,0.1);border-radius:6px;color:rgba(255,255,255,0.8);text-decoration:none;text-align:center;transition:all 0.3s;cursor:pointer;}
    .admin-logout:hover{background:rgba(255,0,0,0.3);color:white;}
    
    /* MAIN CONTENT */
    .admin-main{margin-left:250px;padding:2rem;}
    
    /* SECTIONS */
    .admin-section{background:white;padding:2rem;border-radius:8px;margin-bottom:2rem;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;margin-bottom:1.5rem;color:var(--dark);}
    
    /* FORMS */
    .form-group{margin-bottom:1.5rem;}
    label{display:block;margin-bottom:0.5rem;font-weight:500;color:var(--text);}
    input,textarea,select{width:100%;padding:0.8rem;border:1px solid #ddd;border-radius:6px;font-family:inherit;font-size:1rem;}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(201,115,122,0.1);}
    textarea{resize:vertical;min-height:100px;}
    
    /* BUTTONS */
    .btn{padding:0.8rem 1.5rem;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:0.9rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.3s;}
    .btn-primary{background:var(--rose);color:white;}
    .btn-primary:hover{background:#b5565d;transform:translateY(-2px);}
    .btn-secondary{background:#e0e0e0;color:var(--dark);}
    .btn-secondary:hover{background:#d0d0d0;}
    .btn-danger{background:#ff5252;color:white;}
    .btn-danger:hover{background:#ff1744;}
    .btn-small{padding:0.5rem 1rem;font-size:0.8rem;}
    
    /* PRODUCT LIST */
    .product-item{display:grid;grid-template-columns:80px 1fr auto;gap:1rem;align-items:center;padding:1rem;background:#f9f9f9;border-radius:6px;margin-bottom:1rem;}
    .product-thumb{width:80px;height:80px;background:#e0e0e0;border-radius:6px;overflow:hidden;}
    .product-thumb img{width:100%;height:100%;object-fit:cover;}
    .product-info{flex:1;}
    .product-info h3{margin-bottom:0.3rem;color:var(--dark);}
    .product-info p{font-size:0.9rem;color:var(--gray);}
    .product-actions{display:flex;gap:0.5rem;}
    
    /* MODAL */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1001;align-items:center;justify-content:center;padding:1rem;}
    .modal.show{display:flex;}
    .modal-content{background:white;padding:2rem;border-radius:12px;max-width:500px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.3);position:relative;}
    .modal-header{font-family:'Cormorant Garamond',serif;font-size:1.6rem;margin-bottom:1.5rem;color:var(--dark);}
    .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:2rem;cursor:pointer;color:var(--gray);}
    
    .success{background:#e8f5e9;color:#2e7d32;padding:1rem;border-radius:6px;margin-bottom:1rem;display:none;}
    .error{background:#ffebee;color:#c62828;padding:1rem;border-radius:6px;margin-bottom:1rem;display:none;}
    
    /* LOGIN MODAL */
    .login-container{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;align-items:center;justify-content:center;}
    .login-container.show{display:flex;}
    .login-box{background:white;padding:3rem;border-radius:12px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
    .login-title{font-family:'Cormorant Garamond',serif;font-size:2rem;margin-bottom:2rem;color:var(--dark);text-align:center;}
    .login-error{background:#ffebee;color:#c62828;padding:1rem;border-radius:6px;margin-bottom:1rem;display:none;}
    .loading{opacity:0.6;pointer-events:none;}
    
    @media(max-width:768px){
      .admin-container{grid-template-columns:1fr;}
      .admin-sidebar{position:fixed;width:200px;z-index:1000;}
      .admin-main{margin-left:200px;padding:1rem;}
      .product-actions{flex-direction:column;}
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-container show" id="loginContainer">
  <div class="login-box">
    <div class="login-title">🎀 Blushoria Admin</div>
    <div class="login-error" id="loginError"></div>
    
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="adminUsername" placeholder="Enter username" onkeypress="if(event.key==='Enter') adminLoginSupabase()">
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter') adminLoginSupabase()">
    </div>
    
    <button class="btn btn-primary" style="width:100%;margin-top:1rem;" id="loginBtn" onclick="adminLoginSupabase()">Login</button>
    
    <p style="text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--gray);">
      Default: username: <strong>admin</strong> | password: <strong>admin123</strong>
    </p>
  </div>
</div>

<!-- ADMIN PANEL (Hidden until logged in) -->
<div class="admin-container" id="adminPanel" style="display:none;">
  
  <!-- SIDEBAR -->
  <div class="admin-sidebar">
    <div class="admin-logo">🎀 Admin</div>
    <div style="color:rgba(255,255,255,0.6);font-size:0.8rem;margin-bottom:1.5rem;" id="adminUsername">Admin</div>
    <div class="admin-nav">
      <a href="#" onclick="showSection('products')" class="nav-item active">Products</a>
      <a href="#" onclick="showSection('analytics')" class="nav-item">Analytics</a>
    </div>
    <a href="#" onclick="adminLogout()" class="admin-logout">Logout</a>
  </div>
  
  <!-- MAIN CONTENT -->
  <div class="admin-main">
    
    <!-- PRODUCTS SECTION -->
    <div id="productsSection" class="admin-section">
      <div class="section-title">Products Management</div>
      <button class="btn btn-primary" onclick="openAddProductModal()">+ Add New Product</button>
      
      <div id="successMsg" class="success"></div>
      <div id="errorMsg" class="error"></div>
      
      <div id="productsList" style="margin-top:2rem;"></div>
    </div>
    
    <!-- ANALYTICS SECTION -->
    <div id="analyticsSection" class="admin-section" style="display:none;">
      <div class="section-title">Analytics Dashboard</div>
      <div style="background:#f0f7ff;padding:1.5rem;border-radius:8px;border-left:4px solid var(--rose);margin-bottom:1rem;">
        <div style="color:var(--gray);font-size:0.9rem;">Total Sales</div>
        <div style="font-size:2rem;font-weight:600;color:var(--rose);margin-top:0.5rem;">₦0</div>
      </div>
      <p style="color:var(--gray);">Analytics sync coming soon...</p>
    </div>
    
  </div>
</div>

<!-- ADD/EDIT PRODUCT MODAL -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeProductModal()">✕</button>
    <div class="modal-header">Add Product</div>
    
    <form id="productForm" onsubmit="saveProduct(event)">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="productName" required>
      </div>
      
      <div class="form-group">
        <label>Category *</label>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="lipgloss">Lipgloss</option>
          <option value="facemask">Face Mask</option>
          <option value="lipmask">Lip Mask</option>
          <option value="lipoil">Lip Oil</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Description *</label>
        <textarea id="productDesc" required></textarea>
      </div>
      
      <div class="form-group">
        <label>Price (₦) *</label>
        <input type="number" id="productPrice" required>
      </div>
      
      <div class="form-group">
        <label>Badge (Optional)</label>
        <input type="text" id="productBadge" placeholder="e.g., Best Seller">
      </div>
      
      <div class="form-group">
        <label>Image Filename *</label>
        <input type="text" id="productImage" required placeholder="product1.jpg">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width:100%;">Save Product</button>
    </form>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-auth.js?v=3"></script>
<script>
  // Check if already logged in
  if(isAdminLoggedIn()) {
    const user = getCurrentAdminUser();
    document.getElementById('loginContainer').classList.remove('show');
    document.getElementById('adminPanel').style.display = 'grid';
    document.getElementById('adminUsername').textContent = 'User: ' + user.username;
    renderProducts();
  }
  
  // Demo products
  const DEMO_PRODUCTS = [
    {id:1,name:'Sadoer Fruit Lip Masks',category:'lipmask',description:'Sweet variants. Plumper lips.',price:400,image:'product1.jpg',badge:'Best Seller'},
    {id:5,name:'Cute Glitter Lipgloss',category:'lipgloss',description:'Holographic glitter with bear charm.',price:1200,image:'product5.jpg',badge:'Girlie Fave'},
    {id:6,name:'Hanlanya Lip Oil',category:'lipoil',description:'Hydrating with high-gloss mirror finish.',price:1500,image:'product6.jpg'},
  ];
  
  let products = JSON.parse(localStorage.getItem('blushoriaProducts')) || DEMO_PRODUCTS;
  
  // ===== ADMIN LOGIN SUPABASE =====
  async function adminLoginSupabase() {
    const username = document.getElementById('adminUsername').value.trim();
    const password = document.getElementById('adminPassword').value.trim();
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    
    if(!username || !password) {
      loginError.textContent = '❌ Enter both username and password';
      loginError.style.display = 'block';
      return;
    }
    
    loginBtn.classList.add('loading');
    loginBtn.textContent = 'Logging in...';
    
    const result = await adminLoginToSupabase(username, password);
    
    if(result.success) {
      loginError.style.display = 'none';
      document.getElementById('loginContainer').classList.remove('show');
      document.getElementById('adminPanel').style.display = 'grid';
      document.getElementById('adminUsername').textContent = 'User: ' + result.user.username;
      renderProducts();
    } else {
      loginError.textContent = '❌ ' + result.message;
      loginError.style.display = 'block';
      document.getElementById('adminPassword').value = '';
      loginBtn.classList.remove('loading');
      loginBtn.textContent = 'Login';
    }
  }
  
  // ===== SECTION NAVIGATION =====
  function showSection(sectionName) {
    document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
    document.getElementById(sectionName + 'Section').style.display = 'block';
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    event.target.classList.add('active');
    
    if(sectionName === 'products') renderProducts();
  }
  
  // ===== RENDER PRODUCTS =====
  function renderProducts() {
    const list = document.getElementById('productsList');
    list.innerHTML = products.length === 0 
      ? '<p style="color:var(--gray);">No products yet. Add your first product!</p>'
      : products.map(p => `
        <div class="product-item">
          <div class="product-thumb">
            <img src="${p.image}" onerror="this.src='https://via.placeholder.com/80?text=${encodeURIComponent(p.name)}'">
          </div>
          <div class="product-info">
            <h3>${p.name}</h3>
            <p>₦${p.price.toLocaleString()} • ${p.category}</p>
          </div>
          <div class="product-actions">
            <button class="btn btn-secondary btn-small" onclick="editProduct(${p.id})">Edit</button>
            <button class="btn btn-danger btn-small" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        </div>
      `).join('');
  }
  
  // ===== ADD PRODUCT MODAL =====
  function openAddProductModal() {
    document.getElementById('productForm').reset();
    document.querySelector('.modal-header').textContent = 'Add Product';
    document.getElementById('productForm').dataset.id = '';
    document.getElementById('productModal').classList.add('show');
  }
  
  function closeProductModal() {
    document.getElementById('productModal').classList.remove('show');
  }
  
  // ===== SAVE PRODUCT =====
  function saveProduct(e) {
    e.preventDefault();
    
    const id = document.getElementById('productForm').dataset.id;
    const newProduct = {
      id: id ? parseInt(id) : Math.max(0, ...products.map(p => p.id || 0)) + 1,
      name: document.getElementById('productName').value,
      category: document.getElementById('productCategory').value,
      description: document.getElementById('productDesc').value,
      price: parseInt(document.getElementById('productPrice').value),
      image: document.getElementById('productImage').value,
      badge: document.getElementById('productBadge').value || null
    };
    
    if(id) {
      const index = products.findIndex(p => p.id === parseInt(id));
      if(index >= 0) {
        products[index] = newProduct;
        showMessage('Product updated successfully!', 'success');
      }
    } else {
      products.push(newProduct);
      showMessage('Product added successfully!', 'success');
    }
    
    localStorage.setItem('blushoriaProducts', JSON.stringify(products));
    closeProductModal();
    renderProducts();
  }
  
  // ===== EDIT PRODUCT =====
  function editProduct(id) {
    const product = products.find(p => p.id === id);
    if(!product) return;
    
    document.getElementById('productName').value = product.name;
    document.getElementById('productCategory').value = product.category;
    document.getElementById('productDesc').value = product.description;
    document.getElementById('productPrice').value = product.price;
    document.getElementById('productImage').value = product.image;
    document.getElementById('productBadge').value = product.badge || '';
    document.querySelector('.modal-header').textContent = 'Edit Product';
    document.getElementById('productForm').dataset.id = id;
    document.getElementById('productModal').classList.add('show');
  }
  
  // ===== DELETE PRODUCT =====
  function deleteProduct(id) {
    if(confirm('Are you sure you want to delete this product?')) {
      products = products.filter(p => p.id !== id);
      localStorage.setItem('blushoriaProducts', JSON.stringify(products));
      renderProducts();
      showMessage('Product deleted successfully!', 'success');
    }
  }
  
  // ===== MESSAGE DISPLAY =====
  function showMessage(msg, type) {
    const el = document.getElementById(type === 'success' ? 'successMsg' : 'errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }
  
  // ===== CLOSE MODAL ON ESCAPE =====
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeProductModal();
  });
</script>

</body>
</html>
