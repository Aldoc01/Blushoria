<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blushoria Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>

<div class="admin-wrapper" id="adminWrapper" style="display:none;">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">🎀 Admin</div>
    <div class="sidebar-user">
      <strong id="userEmail">Admin</strong>
      <p style="margin-top:0.5rem;opacity:0.8;">Logged in</p>
    </div>
    <div class="sidebar-nav">
      <a href="#" onclick="showSection('products')" class="active" style="display:block;">Products</a>
    </div>
    <button class="logout-btn" onclick="adminLogout()">Logout</button>
  </div>
  
  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="header">
      <h1>Products</h1>
      <button class="btn-primary" onclick="openAddModal()">+ Add Product</button>
    </div>
    
    <div id="successMsg" class="success-msg"></div>
    <div id="errorMsg" class="error-msg"></div>
    
    <div class="products-container">
      <div id="productsList"></div>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modalTitle">Add Product</h2>
    
    <form id="productForm" onsubmit="saveProduct(event)">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="productName" required>
      </div>
      
      <div class="form-group">
        <label>Category *</label>
        <select id="productCategory" required>
          <option value="">Select Category</option>
          <option value="lipgloss">Lipgloss</option>
          <option value="facemask">Face Mask</option>
          <option value="lipmask">Lip Mask</option>
          <option value="lipoil">Lip Oil</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Description *</label>
        <textarea id="productDesc" required></textarea>
      </div>
      
      <div class="form-group">
        <label>Price (₦) *</label>
        <input type="number" id="productPrice" required>
      </div>
      
      <div class="form-group">
        <label>Badge (Optional)</label>
        <input type="text" id="productBadge" placeholder="e.g., Best Seller">
      </div>
      
      <div class="form-group">
        <label>Image Filename *</label>
        <input type="text" id="productImage" required placeholder="product1.jpg">
      </div>
      
      <button type="submit" class="btn-primary" style="width:100%;">Save Product</button>
    </form>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-auth.js"></script>
<script src="admin-app.js"></script>

</body>
</html>
